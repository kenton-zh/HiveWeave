[project]
name = "hiveweave"
version = "0.2.0"
description = "HiveWeave backend — Python port from Elixir/Phoenix"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "structlog>=24.0",
    # hiveweave/__init__.py 的 _bootstrap_dotenv() 直接依赖它：把 .env 灌进
    # os.environ，让 34 处 os.environ.get("HIVEWEAVE_…") 与 pydantic-settings
    # 看到同一份配置。此前只作为 pydantic-settings 的传递依赖存在，依赖树
    # 一变就会让预算配置静默回退到代码默认值 —— 必须显式声明。
    "python-dotenv>=1.0",
    # ACL 沙箱依赖（§10.2）：pywin32 仅 Windows 有 wheel —— 平台 marker 防
    # Linux/macOS `uv sync` 拉取失败（代码层 try/except 已跨平台）。
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "httpx>=0.27.0",
    "mypy>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveweave"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "win32: ACL 沙箱集成测试（真实受限令牌，仅 Windows 运行；非 Windows 自动 skip）",
]
# 单测卡死 120s 自动 dump 全线程栈（定位 teardown/loop 挂起用；
# 正常套件最慢单测远低于此值，不会误触发）
faulthandler_timeout = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# 只检查项目代码，不分析第三方库源码
follow_imports = "skip"
# 增量缓存
incremental = true
# 不强制严格类型注解（渐进式迁移）
check_untyped_defs = false
# 排除测试和迁移文档
exclude = [
    "tests/",
    "docs/",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
]
